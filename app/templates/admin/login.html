<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Access — PhishGuard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #060612;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* grid overlay */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(239,68,68,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239,68,68,.04) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    .card-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      padding: 1rem;
    }

    .admin-card {
      background: rgba(8,6,20,.95);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,.8), 0 0 60px rgba(239,68,68,.06) inset;
      backdrop-filter: blur(28px);
    }

    .card-top-bar {
      height: 3px;
      background: linear-gradient(90deg, #ef4444, #dc2626, #7c6fff);
    }

    .card-inner { padding: 2rem 2rem 1.8rem; }

    /* warning badge */
    .admin-badge {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 10px;
      padding: .5rem 1rem;
      margin-bottom: 1.6rem;
      font-size: .72rem; font-weight: 700; letter-spacing: .8px;
      text-transform: uppercase; color: #ef4444;
    }

    /* logo */
    .admin-logo {
      width: 68px; height: 68px; border-radius: 20px;
      background: linear-gradient(135deg, #ef4444, #dc2626 55%, #7c6fff);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.1rem;
      box-shadow: 0 8px 32px rgba(239,68,68,.45);
      animation: logoPulse 2.8s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { box-shadow: 0 8px 32px rgba(239,68,68,.45); }
      50%      { box-shadow: 0 8px 48px rgba(239,68,68,.75); }
    }

    .card-title {
      font-size: 1.5rem; font-weight: 800; color: #fff;
      text-align: center; margin-bottom: 4px;
    }
    .card-sub {
      font-size: .83rem; color: rgba(255,255,255,.35);
      text-align: center; margin-bottom: 1.6rem;
    }
    .card-sub span { color: #ef4444; font-weight: 700; }

    /* flash */
    .flash-msg {
      display: flex; align-items: center; gap: 8px;
      padding: .55rem .9rem; border-radius: 10px;
      font-size: .8rem; margin-bottom: 1rem;
    }
    .flash-danger  { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.25);  color: #fca5a5; }
    .flash-success { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.25); color: #6ee7b7; }

    /* fields */
    .f-label { font-size: .78rem; color: rgba(255,255,255,.45); margin-bottom: .4rem; display: block; }
    .f-wrap {
      display: flex; align-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px; height: 48px;
      transition: border-color .2s, box-shadow .2s;
      overflow: hidden; margin-bottom: 1rem;
    }
    .f-wrap:focus-within {
      border-color: rgba(239,68,68,.55);
      box-shadow: 0 0 0 3px rgba(239,68,68,.1);
      background: rgba(239,68,68,.04);
    }
    .f-icon {
      width: 44px; display: flex; align-items: center; justify-content: center;
      color: rgba(239,68,68,.65); font-size: .88rem; flex-shrink: 0;
    }
    .f-wrap input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #e0e0e0; font-size: .9rem; height: 100%; padding: 0 10px;
    }
    .f-wrap input::placeholder { color: rgba(107,107,138,.4); }
    .eye-tog {
      width: 44px; height: 100%; background: none; border: none;
      cursor: pointer; color: rgba(239,68,68,.45); font-size: .95rem;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s;
    }
    .eye-tog:hover { color: #ef4444; }

    /* submit */
    .submit-btn {
      width: 100%; height: 50px; border-radius: 13px;
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(135deg, #ef4444, #dc2626 60%, #7c6fff);
      border: none; color: #fff; cursor: pointer;
      box-shadow: 0 6px 28px rgba(239,68,68,.4);
      transition: transform .22s, box-shadow .22s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 1.4rem;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(239,68,68,.6);
    }

    /* back link */
    .back-row {
      text-align: center; font-size: .82rem; color: rgba(255,255,255,.3);
    }
    .back-row a {
      color: rgba(239,68,68,.7); text-decoration: none; font-weight: 600;
      transition: color .2s;
    }
    .back-row a:hover { color: #ef4444; }

    /* security footer */
    .sec-row {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; flex-wrap: wrap; margin-top: 1rem;
    }
    .sec-item { font-size: .65rem; color: rgba(255,255,255,.2); display: flex; align-items: center; gap: 4px; }
    .sec-item i { color: rgba(239,68,68,.4); }
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="card-wrap">
  <div class="admin-card">
    <div class="card-top-bar"></div>
    <div class="card-inner">

      <div class="admin-badge">
        <i class="bi bi-shield-lock-fill"></i>
        Restricted — Admin Access Only
      </div>

      <div class="admin-logo">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="white">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5L12 1z"/>
          <path d="M11 7h2v5h-2zm0 6h2v2h-2z" fill="rgba(255,255,255,.85)"/>
        </svg>
      </div>

      <div class="card-title">Admin Portal</div>
      <div class="card-sub">PhishGuard <span>Control Panel</span></div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash-msg flash-{{ cat }}">
            <i class="bi {% if cat=='danger' %}bi-x-circle-fill{% else %}bi-check-circle-fill{% endif %}"></i>
            {{ msg }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin.admin_login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <label class="f-label">Admin Email</label>
        <div class="f-wrap">
          <span class="f-icon"><i class="bi bi-envelope-fill"></i></span>
          <input type="email" name="email" placeholder="admin@example.com" autocomplete="email" required/>
        </div>

        <label class="f-label">Password</label>
        <div class="f-wrap">
          <span class="f-icon"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" id="adminPwd" placeholder="Enter admin password" autocomplete="current-password" required/>
          <button type="button" class="eye-tog" onclick="toggleEye()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>

        <button type="submit" class="submit-btn">
          <i class="bi bi-shield-lock-fill"></i>Access Admin Panel
        </button>
      </form>

      <div class="back-row">
        Not an admin? <a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left" style="font-size:.72rem;"></i> Back to User Login</a>
      </div>

      <div class="sec-row">
        <span class="sec-item"><i class="bi bi-shield-fill-check"></i>Admin only</span>
        <span class="sec-item"><i class="bi bi-patch-check-fill"></i>CSRF protected</span>
        <span class="sec-item"><i class="bi bi-key-fill"></i>Bcrypt hashed</span>
      </div>

    </div>
  </div>
</div>

<script>
function toggleEye() {
  const el = document.getElementById('adminPwd');
  const ic = document.getElementById('eyeIcon');
  el.type = el.type === 'password' ? 'text' : 'password';
  ic.className = el.type === 'text' ? 'bi bi-eye-slash' : 'bi bi-eye';
}

/* Red particle canvas */
(function () {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const C = ['rgba(239,68,68,','rgba(220,38,38,','rgba(124,111,255,','rgba(255,255,255,'];
  const pts = Array.from({ length: 60 }, () => ({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: Math.random() * 1.6 + .6,
    col: C[Math.floor(Math.random() * C.length)],
    a: Math.random() * .3 + .06,
    dx: (Math.random() - .5) * .28, dy: (Math.random() - .5) * .28,
    p: Math.random() * Math.PI * 2, ps: Math.random() * .015 + .006,
  }));
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach(p => {
      p.p += p.ps;
      const a = p.a * (.5 + .5 * Math.sin(p.p));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.col + a + ')'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = p.col + (a * .08) + ')'; ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
    });
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 110) {
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = 'rgba(239,68,68,' + (.055 * (1 - d / 110)) + ')';
        ctx.lineWidth = .5; ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
