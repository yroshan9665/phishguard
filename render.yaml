services:
  - type: web
    name: phishguard-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_admin.py && gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    autoDeploy: true

databases:
  - name: phishguard-db
    databaseName: phishing_db
    user: phishguard
    plan: free
