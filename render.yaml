services:
  - type: web
    name: phishguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@phishguard.ai
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12
